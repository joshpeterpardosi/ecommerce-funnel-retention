name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what Streamlit Cloud currently resolves to; the older versions
        # keep the project runnable for anyone cloning it on an existing setup.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report resolved versions
        run: pip list | grep -E "^(pandas|numpy|duckdb|pyarrow|streamlit|plotly) "

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: end-to-end data generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the dataset
        run: python scripts/generate_data.py

      - name: Execute every production query against the generated data
        run: python scripts/benchmark.py

      - name: Assert the data quality audit reports no defects
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import duckdb

          query = Path("sql/data_quality.sql").read_text(encoding="utf-8")
          df = duckdb.connect().execute(query).df()
          print(df.to_string(index=False))

          numeric = df.select_dtypes(include="number")
          if not (numeric == 0).all().all():
              print("\nERROR: generated dataset failed its own quality audit", file=sys.stderr)
              sys.exit(1)
          print("\nAudit clean.")
          PY
